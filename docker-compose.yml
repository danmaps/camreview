version: "3.8"
services:
  camreview:
    build: .
    container_name: camreview
    env_file:
      - .env
    ports:
      - "100.87.16.33:3510:3000"
    restart: unless-stopped
    environment:
      - PORT=3000
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
    volumes:
      - ./config.local.json:/app/config.local.json:ro
      - /mnt/usb/101media:/data/trailcam:rw

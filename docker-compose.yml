version: "3.8"
services:
  camreview:
    build: .
    container_name: camreview
    ports:
      - "100.87.16.33:3510:3510"
    restart: unless-stopped
    environment:
      - PORT=3510
      # Optional OpenRouter keys
      # - OPENROUTER_API_KEY=...
      # - OPENROUTER_MODEL=...
    volumes:
      - ./config.local.json:/app/config.local.json:ro
      - /mnt/usb/trailcam:/data/trailcam:rw
